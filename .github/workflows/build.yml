name: Compilar ROM (NDS)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar libnds, ndstool e exemplos oficiais
        run: dkp-pacman -Syu --noconfirm nds-dev nds-examples

      - name: Mostrar o que foi instalado (para diagnostico)
        run: |
          ls /opt/devkitpro || true
          ls /opt/devkitpro/libnds || true
          ls /opt/devkitpro/calico || true
          find /opt/devkitpro/examples/nds -maxdepth 3 -name Makefile | head -40

      - name: Compilar com o Makefile OFICIAL do devkitPro (garante ARM7/specs corretos)
        run: |
          set -ex
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          T=$(find /opt/devkitpro/examples/nds -maxdepth 3 -name Makefile -path '*hello_world*' | head -1)
          if [ -z "$T" ]; then T=$(find /opt/devkitpro/examples/nds -maxdepth 3 -name Makefile -path '*templates*' | grep -i arm9 | head -1); fi
          echo "Usando template: $T"
          test -n "$T"
          cp Makefile Makefile.project
          cp "$T" ./Makefile
          sed -i 's/^GRAPHICS[[:space:]]*:=.*/GRAPHICS :=/' Makefile
          sed -i 's/^TARGET[[:space:]]*:=.*/TARGET := daggerfall_ds/' Makefile
          make clean || true
          if ! make; then
            echo "::warning::Template oficial falhou; usando o Makefile do projeto (com -lcalico_ds9)"
            cp Makefile.project Makefile
            make clean || true
            make
          fi
          ls -la *.nds

      - name: Enviar a ROM
        uses: actions/upload-artifact@v4
        with:
          name: daggerfall-ds-rom
          path: "*.nds"

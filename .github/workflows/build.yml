name: Compilar ROM (NDS)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Tentar atualizar pacotes (opcional)
        run: |
          dkp-pacman -Sy --noconfirm nds-dev nds-examples || echo "Sem acesso ao servidor de pacotes; usando o que ja vem na imagem"

      - name: Diagnostico
        run: |
          which ndstool || echo "ndstool NAO encontrado"
          ls /opt/devkitpro || true
          ls /opt/devkitpro/calico/bin || true
          find /opt/devkitpro/examples/nds -maxdepth 3 -name Makefile 2>/dev/null | head -20

      - name: Compilar
        run: |
          set -x
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          cp Makefile Makefile.project
          T=$(find /opt/devkitpro/examples/nds -maxdepth 3 -name Makefile -path '*hello_world*' 2>/dev/null | head -1)
          OK=0
          if [ -n "$T" ]; then
            echo "Tentando template oficial: $T"
            cp "$T" ./Makefile
            sed -i 's/^GRAPHICS[[:space:]]*:=.*/GRAPHICS :=/' Makefile
            sed -i 's/^TARGET[[:space:]]*:=.*/TARGET := daggerfall_ds/' Makefile
            make clean || true
            if make; then OK=1; fi
          fi
          if [ "$OK" -eq 0 ]; then
            echo "Usando o Makefile do projeto"
            cp Makefile.project Makefile
            make clean || true
            make
          fi
          ls -la *.nds

      - name: Enviar a ROM
        uses: actions/upload-artifact@v4
        with:
          name: daggerfall-ds-rom
          path: "*.nds"


name: Compilar ROM (NDS)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        shell: bash
        run: dkp-pacman -Sy --noconfirm nds-dev

      - name: Compilar ROM
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          make

      - name: Disponibilizar ROM
        uses: actions/upload-artifact@v4
        with:
          name: daggerfall-ds-rom
          path: "*.nds"
          if-no-files-found: error
          
